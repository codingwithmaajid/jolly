[project]
name = "ams-hackathon-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "codingwithmaajid", email = "abdulmaajid7002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.52.4",
]

[project.scripts]
ams-hackathon-2026 = "ams_hackathon_2026:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
