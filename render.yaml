services:
  - type: web
    name: jolly-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: Jolly
      - key: APP_VERSION
        value: 0.2.0
      - key: LOG_LEVEL
        value: INFO
      # Comma-separated origins allowed to call the API from a browser.
      # Set to the console's URL, e.g. https://jolly-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Load the three synthetic demo matters into an empty database on boot.
      - key: SEED_DEMO_DATA
        value: "true"
      # Optional Gemini key (free tier). Without it: offline embeddings + extractive cited answers.
      - key: LLM_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_BASE_URL
        value: https://api.bolna.ai
      - key: BOLNA_AGENT_ID
        sync: false
      - key: BOLNA_FROM_NUMBER
        sync: false
      - key: BOLNA_WEBHOOK_SECRET
        sync: false
      # Trust layer (optional; both fall back to BOLNA_WEBHOOK_SECRET)
      - key: APPROVAL_SECRET
        sync: false
      - key: AUDIT_PEPPER
        sync: false

  # Jolly console (frontend/). Static site, free on Render.
  - type: web
    name: jolly-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Backend base URL, baked in at build time, e.g. https://jolly-backend.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
